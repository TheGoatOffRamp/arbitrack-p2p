<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArbiTrack - P2P Arbitrage Pro</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    /* ====== ESTILOS — paleta y forma según DESIGN.md (ver capa "TEMA" al final) ====== */
    :root {
      --bg: #05060f;
      --card: rgba(5, 6, 15, 0.8);
      --border: rgba(255, 255, 255, 0.06);
      --txt: #d1e4fa;
      --muted: #9da7ba;
      --dim: #6b7488;
      --green: #269684;
      --blue: #98c0ef;
      --purple: #c7d3ea;
      --yellow: #e0b26a;
      --red: #e46d4c
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #2f343e transparent
    }

    *::-webkit-scrollbar {
      width: 6px
    }

    *::-webkit-scrollbar-track {
      background: transparent
    }

    *::-webkit-scrollbar-thumb {
      background: #2f343e;
      border-radius: 3px
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--txt);
      font-size: 13px;
      line-height: 1.5
    }

    input,
    select,
    button {
      font-family: inherit;
      font-size: 13px
    }

    input:focus,
    select:focus {
      border-color: rgba(38, 150, 132, 0.3) !important;
      outline: none
    }

    .side {
      width: 220px;
      background: linear-gradient(180deg, #0a0c18, #05060f);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column
    }

    .logo {
      padding: 20px 16px;
      border-bottom: 1px solid var(--border)
    }

    .logo h1 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #269684, #98c0ef, #c7d3ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .logo p {
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px
    }

    .nav {
      padding: 12px 10px;
      flex: 1;
      overflow-y: auto
    }

    .ni {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: all .2s;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
      border: 1px solid transparent;
      margin-bottom: 3px;
      user-select: none
    }

    .ni:hover {
      background: rgba(255, 255, 255, 0.03)
    }

    .ni.on {
      background: rgba(38, 150, 132, 0.1);
      color: var(--green);
      font-weight: 600;
      border-color: rgba(38, 150, 132, 0.15)
    }

    .ni svg {
      flex-shrink: 0
    }

    .ni .dot {
      margin-left: auto;
      width: 7px;
      height: 7px;
      border-radius: 4px;
      background: var(--green);
      flex-shrink: 0
    }

    .side-apis {
      padding: 8px 10px;
      border-top: 1px solid var(--border)
    }

    .side-apis-box {
      background: rgba(38, 150, 132, 0.06);
      border-radius: 8px;
      padding: 7px 10px;
      border: 1px solid rgba(38, 150, 132, 0.1)
    }

    .side-apis-box h4 {
      font-size: 10px;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 3px
    }

    .side-apis-box .api-name {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px
    }

    .side-apis-box .api-name::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 3px;
      background: var(--green);
      flex-shrink: 0
    }

    .main {
      margin-left: 220px;
      padding: 22px 24px;
      min-height: 100vh
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 18px;
      backdrop-filter: blur(10px)
    }

    .h1 {
      font-size: 20px;
      font-weight: 700;
      color: #d1e4fa
    }

    .h2 {
      font-size: 14px;
      font-weight: 600;
      color: #c7d3ea;
      margin-bottom: 12px
    }

    .lb {
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px
    }

    .inp {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--txt);
      width: 100%;
      box-sizing: border-box
    }

    .sel {
      background: #0a0c18;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--txt);
      width: 100%;
      box-sizing: border-box;
      cursor: pointer
    }

    .sel option {
      background: #0a0c18;
      color: #d1e4fa;
      padding: 8px 12px
    }

    .inp-green {
      background: rgba(38, 150, 132, 0.06);
      border-color: rgba(38, 150, 132, 0.15)
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s;
      white-space: nowrap;
      font-weight: 600
    }

    .btn-p {
      background: linear-gradient(135deg, #269684, #4fb8a4);
      color: #fff;
      font-weight: 700
    }

    .btn-s {
      background: rgba(255, 255, 255, 0.06);
      color: var(--txt)
    }

    .btn-d {
      background: rgba(228, 109, 76, 0.15);
      color: var(--red)
    }

    .btn-g {
      background: transparent;
      color: var(--muted);
      padding: 6px
    }

    .btn-ok {
      background: rgba(38, 150, 132, 0.15);
      color: var(--green)
    }

    .btn:hover {
      opacity: .9
    }

    .btn-full {
      width: 100%;
      justify-content: center
    }

    .bg {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      gap: 4px
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .g3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px
    }

    .g4 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px
    }

    .g6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px
    }

    .fx {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .fxb {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .fxw {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px
    }

    .fxe {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px
    }

    .mt {
      margin-top: 14px
    }

    .mb {
      margin-bottom: 14px
    }

    .mb2 {
      margin-bottom: 22px
    }

    .gs2 {
      grid-column: span 2
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .3px
    }

    td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03)
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.02)
    }

    .mono {
      font-family: 'JetBrains Mono', monospace
    }

    .tg-group {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 18px
    }

    .tg-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .5px;
      transition: all .2s;
      background: transparent;
      color: var(--dim)
    }

    .tg-btn.buy {
      background: rgba(152, 192, 239, 0.2);
      color: var(--blue)
    }

    .tg-btn.sell {
      background: rgba(38, 150, 132, 0.2);
      color: var(--green)
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: none;
      justify-content: center;
      align-items: center
    }

    .ov.open {
      display: flex
    }

    .ml {
      background: #0a0c18;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 26px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto
    }

    .sc {
      padding: 18px;
      border-radius: 13px;
      position: relative;
      overflow: hidden
    }

    .sc .gw {
      position: absolute;
      top: -30px;
      right: -30px;
      width: 80px;
      height: 80px;
      border-radius: 50%
    }

    .sc .slb {
      font-size: 11px;
      font-weight: 600;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px
    }

    .sc .sv {
      font-size: 23px;
      font-weight: 800;
      color: #d8ecf8
    }

    .sc .ss {
      font-size: 11px;
      color: var(--dim);
      margin-top: 4px
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      animation: sup .3s ease
    }

    .toast.on {
      display: flex
    }

    .toast.ok {
      background: rgba(38, 150, 132, 0.95);
      color: #fff
    }

    .toast.err {
      background: rgba(228, 109, 76, 0.95);
      color: #fff
    }

    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: linear-gradient(135deg, #269684, #4fb8a4);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(38, 150, 132, 0.3);
      transition: transform .2s
    }

    .fab:hover {
      transform: scale(1.1)
    }

    .fab svg {
      width: 22px;
      height: 22px
    }

    .qp {
      position: fixed;
      bottom: 90px;
      right: 24px;
      z-index: 250;
      width: 390px;
      background: #0a0c18;
      border: 1px solid rgba(38, 150, 132, 0.2);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      display: none
    }

    .qp.open {
      display: block
    }

    .pg {
      display: none
    }

    .pg.on {
      display: block
    }

    .ibox {
      padding: 14px;
      border-radius: 8px;
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .ibox .iw {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .sync-box {
      background: rgba(152, 192, 239, 0.05);
      border: 1px solid rgba(152, 192, 239, 0.1);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px
    }

    .sync-box h4 {
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .quick-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    .quick-btns button {
      padding: 4px 10px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px
    }

    .conn-banner {
      padding: 10px 16px;
      border-radius: 13px;
      background: linear-gradient(90deg, rgba(38, 150, 132, 0.06), rgba(152, 192, 239, 0.04));
      border: 1px solid rgba(38, 150, 132, 0.12);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    @keyframes sup {
      from {
        transform: translateX(-50%) translateY(20px);
        opacity: 0
      }

      to {
        transform: translateX(-50%) translateY(0);
        opacity: 1
      }
    }
    /* ====== AÑADIDOS v2 (mismo estilo) ====== */
    .msg { padding: 10px 14px; border-radius: 9px; font-size: 12px; line-height: 1.6; margin-bottom: 10px; border: 1px solid }
    .msg.err { background: rgba(228, 109, 76, 0.07); border-color: rgba(228, 109, 76, 0.2); color: #fca5a5 }
    .msg.warn { background: rgba(224, 178, 106, 0.07); border-color: rgba(224, 178, 106, 0.2); color: #fde68a }
    .msg.ok { background: rgba(38, 150, 132, 0.07); border-color: rgba(38, 150, 132, 0.2); color: #6ee7b7 }
    .msg.info { background: rgba(152, 192, 239, 0.06); border-color: rgba(152, 192, 239, 0.15); color: #bfdbfe }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; font-size: 12px }
    .kv > div:nth-child(odd) { color: var(--muted) }
    .kv > div:nth-child(even) { text-align: right; font-weight: 600 }
    .num { text-align: right; font-family: 'JetBrains Mono', monospace; white-space: nowrap }
    .ml.wide { max-width: 980px }
    .scroll-y { max-height: 340px; overflow-y: auto }
    .drop { border: 2px dashed rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 34px 20px; text-align: center; cursor: pointer; transition: all .2s }
    .drop.over, .drop:hover { border-color: rgba(38, 150, 132, 0.35); background: rgba(38, 150, 132, 0.03) }
    .ni .cnt { margin-left: auto; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: rgba(224, 178, 106, 0.15); color: var(--yellow) }
    .empty { text-align: center; color: #6b7488; padding: 36px }
    th.num { text-align: right }
    @media (max-width: 900px) {
      .side { width: 64px } .side .logo p, .side .logo h1, .side-apis, .ni span.lbl, #user-box-text { display: none }
      .main { margin-left: 64px; padding: 16px } .g3, .g4, .g6 { grid-template-columns: 1fr 1fr } .g2 { grid-template-columns: 1fr }
      .qp { width: calc(100vw - 32px); right: 16px }
    }

    /* ====== TEMA (DESIGN.md: «Frosted glass cathedral at midnight») ======
       Monocromo frío sobre lienzo medianoche, superficies de vidrio con borde interior escarchado,
       violeta solo en la acción principal. Para datos: teal = ganancia/venta, azul hielo = compra, ember = pérdida. */
    :root {
      --bg: #05060f; --txt: #d1e4fa; --muted: #c7d3ea; --dim: #9da7ba; --head: #d8ecf8;
      --green: #3daa94; --blue: #98c0ef; --red: #e46d4c; --yellow: #e0b26a; --violet: #663af3;
      --edge: rgba(186, 215, 247, 0.12); --edge-strong: rgba(186, 215, 247, 0.24); --frost: rgba(186, 214, 247, 0.06); --glass: rgba(186, 214, 247, 0.03);
      --border: rgba(186, 215, 247, 0.12);
      --card: rgba(186, 214, 247, 0.03);
      --shadow-card: inset 0 1px 1px rgba(199, 211, 234, 0.12), inset 0 24px 48px rgba(199, 211, 234, 0.05), 0 24px 32px rgba(6, 6, 14, 0.7);
      --shadow-modal: inset 0 1px 1px rgba(216, 236, 248, 0.2), inset 0 24px 48px rgba(168, 216, 245, 0.06), 0 16px 32px rgba(0, 0, 0, 0.3);
      --font-ui: 'Inter', ui-sans-serif, system-ui, sans-serif; --font-display: 'Space Grotesk', 'Inter', sans-serif; --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-ui); letter-spacing: -0.01em; color: var(--txt);
      background:
        radial-gradient(ellipse 60% 40% at 50% -5%, rgba(124, 145, 182, 0.22), transparent 70%),
        linear-gradient(rgba(186, 215, 247, 0.04) 1px, transparent 1px) 0 0 / 80px 80px,
        linear-gradient(90deg, rgba(186, 215, 247, 0.04) 1px, transparent 1px) 0 0 / 80px 80px,
        var(--bg);
      background-attachment: fixed;
    }
    * { scrollbar-color: #2f343e transparent }
    *::-webkit-scrollbar-thumb { background: #2f343e }
    input:focus, select:focus, textarea:focus { border-color: var(--edge-strong) !important; box-shadow: 0 0 0 3px rgba(186, 215, 247, 0.06) }

    .side { background: rgba(5, 6, 15, 0.85); backdrop-filter: blur(16px); border-right: 0; box-shadow: inset -1px 0 0 var(--edge) }
    :root { color-scheme: dark }
    .logo { border-bottom: 1px solid var(--edge) }
    .logo a { text-decoration: none }
    .logo h1 { font-family: var(--font-display); font-weight: 500; background: linear-gradient(0deg, #98c0ef, #d8ecf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
    .logo p { font-family: var(--font-mono); letter-spacing: .1em; color: var(--dim) }
    .ni { color: var(--dim); border-radius: 999px; border: 0 }
    .ni:hover { background: var(--glass); color: var(--txt) }
    .ni.on { background: var(--frost); color: #fff; font-weight: 500; box-shadow: inset 0 0 0 1px var(--edge) }
    .ni .dot { background: var(--blue) }
    .ni .cnt { background: rgba(228, 109, 76, 0.14); color: #f0a38c }
    .side-apis { border-top: 1px solid var(--edge) }
    .side-apis-box { background: var(--glass); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 6px }
    .side-apis-box h4 { color: var(--muted); font-family: var(--font-mono); letter-spacing: .1em; font-weight: 400 }
    .side-apis-box .api-name::before { background: var(--blue) }

    .card { background: var(--glass); border: 0; border-radius: 16px; box-shadow: var(--shadow-card); backdrop-filter: blur(12px) }
    .sc { border-radius: 16px; box-shadow: var(--shadow-card); background: var(--glass) !important; border: 0 !important }
    .sc .gw { display: none }
    .sc .slb, .lb, th { font-family: var(--font-mono); font-weight: 400; letter-spacing: .1em; color: var(--dim) }
    .sc .sv { font-family: var(--font-display); font-weight: 500; color: var(--head); letter-spacing: 0 }
    .h1 { font-family: var(--font-display); font-weight: 500; font-size: 28px; line-height: 1.14; background: linear-gradient(0deg, #98c0ef, #d8ecf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent }
    .h2 { font-weight: 500; color: var(--head) }

    .inp, .sel { background: rgba(199, 211, 234, 0.06); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 6px; color: #fff }
    .inp:focus, .sel:focus { box-shadow: inset 0 0 0 1px var(--edge-strong), 0 0 0 3px rgba(186, 215, 247, 0.06) }
    .inp::placeholder { color: rgba(199, 211, 234, 0.6) }
    .sel option { background: #0a0c18; color: var(--txt) }
    .inp-green { background: rgba(61, 170, 148, 0.06); box-shadow: inset 0 0 0 1px rgba(61, 170, 148, 0.24) }

    .btn { border-radius: 999px; font-weight: 500; padding: 8px 16px; transition: background .2s, box-shadow .2s }
    .btn:hover { opacity: 1 }
    .btn-p { background: var(--violet); color: #fff; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18) }
    .btn-p:hover { background: #7550f5 }
    .btn-s { background: var(--frost); color: #fff; box-shadow: inset 0 0 0 1px var(--edge) }
    .btn-s:hover { background: rgba(186, 214, 247, 0.12) }
    .btn-d { background: transparent; color: #f0a38c; box-shadow: inset 0 0 0 1px rgba(228, 109, 76, 0.32) }
    .btn-d:hover { background: rgba(228, 109, 76, 0.08) }
    .btn-ok { background: transparent; color: var(--green); box-shadow: inset 0 0 0 1px rgba(61, 170, 148, 0.32) }
    .btn-g { color: var(--dim); border-radius: 999px }
    .btn-g:hover { background: var(--frost); color: #fff }
    .bg { border-radius: 6px; font-weight: 500 }
    .tag { border-radius: 6px; background: rgba(199, 211, 234, 0.12); color: var(--txt) }

    td { border-bottom: 1px solid rgba(186, 215, 247, 0.06) }
    tbody tr:hover { background: var(--glass) }
    .mono, .num { font-family: var(--font-mono) }

    .tg-group { background: var(--glass); border-radius: 999px; box-shadow: inset 0 0 0 1px var(--edge) }

    .ov { background: rgba(5, 6, 15, 0.7); backdrop-filter: blur(8px) }

    .fab { background: var(--violet); box-shadow: 0 0 12px rgba(102, 58, 243, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2) }
    .toast { border-radius: 999px; backdrop-filter: blur(12px) }
    .toast.ok { background: rgba(10, 12, 24, 0.95); color: var(--txt); box-shadow: inset 0 0 0 1px rgba(61, 170, 148, 0.4) }
    .toast.err { background: rgba(10, 12, 24, 0.95); color: #f0a38c; box-shadow: inset 0 0 0 1px rgba(228, 109, 76, 0.45) }

    .msg { border-radius: 6px }
    .msg.err { background: rgba(228, 109, 76, 0.07); border-color: rgba(228, 109, 76, 0.24); color: #f0a38c }
    .msg.warn { background: rgba(224, 178, 106, 0.07); border-color: rgba(224, 178, 106, 0.24); color: #ecc98f }
    .msg.ok { background: rgba(61, 170, 148, 0.07); border-color: rgba(61, 170, 148, 0.24); color: #8fd6c6 }
    .msg.info { background: var(--glass); border-color: var(--edge); color: var(--muted) }
    .drop { border: 1px dashed var(--edge-strong); border-radius: 16px }
    .drop.over, .drop:hover { border-color: rgba(186, 215, 247, 0.4); background: var(--glass) }
    .sync-box, .conn-banner { background: var(--glass); border: 0; box-shadow: inset 0 0 0 1px var(--edge); border-radius: 16px }
    .quick-btns button { border-radius: 999px; background: var(--frost); box-shadow: inset 0 0 0 1px var(--edge) }
    .empty { color: var(--dim) }
    .kline { display: flex; justify-content: space-between; gap: 10px; padding: 7px 12px; border-radius: 6px; background: rgba(199, 211, 234, 0.04); font-size: 12px; color: var(--muted) }
    .kline b { font-family: var(--font-mono); font-weight: 400; color: var(--txt); white-space: nowrap }
    .lock-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--dim); font-size: 11px }
  </style>

  <script>
    'use strict';
    // ==================== HELPERS ====================
    const $ = id => document.getElementById(id);
    const ic = (id, w = 18) => `<svg width="${w}" height="${w}"><use href="#i-${id}"/></svg>`;
    const TZ = 'America/Lima';
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const nf = (v, min = 2, max = 2) => { const n = Number(v); return Number.isFinite(n) ? n.toLocaleString('es-PE', { minimumFractionDigits: min, maximumFractionDigits: max }) : '—'; };
    const SYM = { PEN: 'S/', USD: '$', EUR: '€', ARS: 'AR$', BRL: 'R$', COP: 'COL$', MXN: 'MX$', VES: 'Bs.', CLP: 'CLP$', BOB: 'Bs' };
    // Importe fiat con el símbolo de SU moneda (nunca se asume otra moneda)
    const fc = (v, c) => { const n = Number(v) || 0; return `${n < 0 ? '−' : ''}${SYM[c] || (c ? c + ' ' : '')} ${nf(Math.abs(n))}`; };
    const fq = v => nf(v, 2, 8);      // cantidades cripto sin perder decimales
    const fp = v => nf(v, 4, 6);      // precios
    const fd = iso => new Date(iso).toLocaleString('es-PE', { timeZone: TZ, day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    const limaDay = (d = new Date()) => new Date(d).toLocaleDateString('en-CA', { timeZone: TZ });
    const daysAgo = n => limaDay(Date.now() - n * 86400000);
    // "YYYY-MM-DDTHH:mm" en hora de Lima (para inputs datetime-local)
    function limaInput(d = new Date()) {
      const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(d).forEach(x => p[x.type] = x.value);
      return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
    }
    const PM = { PEN: ["Yape", "Plin", "BCP (Banco de Crédito)", "Interbank", "BBVA Perú", "Scotiabank Perú", "Banco de la Nación", "BanBif", "Lemon Cash Perú", "BIM", "MiBanco", "Caja Huancayo", "Transferencia Bancaria", "Efectivo", "Otro"], ARS: ["Mercado Pago", "Brubank", "Ualá", "Banco Galicia", "BBVA Argentina", "Banco Nación", "Lemon Cash", "Transferencia Bancaria", "Efectivo", "Otro"], BRL: ["Pix", "Nubank", "Banco do Brasil", "Itaú", "Bradesco", "Inter", "C6 Bank", "Transferencia Bancaria", "Efectivo", "Otro"], COP: ["Nequi", "Daviplata", "Bancolombia", "Banco de Bogotá", "Davivienda", "Transferencia Bancaria", "Efectivo", "Otro"], MXN: ["SPEI", "Mercado Pago", "BBVA México", "Banorte", "Nu México", "Transferencia Bancaria", "Efectivo", "Otro"], VES: ["Pago Móvil", "Banesco", "Banco de Venezuela", "Zinli", "Zelle", "Transferencia Bancaria", "Efectivo", "Otro"], USD: ["Zelle", "PayPal", "Wise", "Payoneer", "Transferencia Bancaria", "Efectivo", "Otro"], EUR: ["Wise", "Revolut", "N26", "PayPal", "SEPA", "Transferencia Bancaria", "Efectivo", "Otro"] };
    const gpm = f => PM[f] || PM.USD;
    const EX = ["Binance", "Bybit", "OKX", "Bitget", "El Dorado", "KuCoin", "Gate.io", "MEXC", "HTX", "BingX", "Crypto.com", "AirTM", "Lemon Cash", "Buda.com", "Buenbit", "Otro"];
    const CR = ["USDT", "USDC", "BTC", "ETH", "BNB", "SOL", "XRP", "TRX", "MATIC"];
    const FI = ["PEN", "USD", "EUR", "ARS", "BRL", "COP", "MXN", "VES"];
    // opciones de un <select>; si el valor actual no está en la lista, se agrega (evita cambiarlo al editar)
    const opts = (arr, sel) => { const list = sel && !arr.includes(sel) ? [sel, ...arr] : arr; return list.map(x => `<option${x === sel ? " selected" : ""}>${esc(x)}</option>`).join(""); };
    const CC = ["#98c0ef", "#3daa94", "#c7d3ea", "#663af3", "#e46d4c", "#b6d9fc", "#027dea", "#6b7488"];
    const ST = { completado: ["Completada", "#269684"], pendiente: ["Pendiente", "#e0b26a"], cancelado: ["Cancelada", "#e46d4c"], fallido: ["Fallida", "#e46d4c"], en_disputa: ["En disputa", "#e46d4c"], desconocido: ["Desconocido", "#9da7ba"] };
    const SEV = { error: ["Error", "#e46d4c"], warning: ["Advertencia", "#e0b26a"], info: ["Info", "#98c0ef"] };
    const SRC = { api: ["API", "rgba(152, 192, 239, 0.18);color:var(--blue)"], csv: ["Archivo", "rgba(224, 178, 106, 0.15);color:var(--yellow)"], manual: ["Man", "rgba(186, 215, 247, 0.18);color:var(--purple)"] };

    // ==================== ESTADO ====================
    let trades = [], page = "dashboard", editing = null, charts = {}, logs = [], issueCount = 0;
    const APIS = [
      { id: "binance", name: "Binance", icon: "₿", mode: "api" },
      { id: "bybit", name: "Bybit", icon: "◎", mode: "api" },
      { id: "bitget", name: "Bitget", icon: "⬡", mode: "api", passphrase: true },
      { id: "okx", name: "OKX", icon: "◈", mode: "file", note: "OKX no ofrece una API de historial P2P para cuentas normales. Exporta el archivo desde OKX e impórtalo." },
      { id: "eldorado", name: "El Dorado", icon: "🟡", mode: "file", note: "El Dorado no tiene API pública. Exporta tu historial e impórtalo, o registra con el botón ⚡." },
      { id: "kucoin", name: "KuCoin", icon: "⟐", mode: "file", note: "Sincronización por API no disponible. Importa el archivo exportado." },
    ];
    let connected = {}; // slug -> { connectedAt, apiKey }
    let ME = null; // usuario con sesión (modo multiusuario); null en modo local
    const SETTINGS_KEY = "arbitrack-settings";
    const settings = Object.assign({ name: "", exchange: "Binance", crypto: "USDT", fiat: "PEN", autoSync: true, autoSyncMinutes: 5 }, (() => { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (e) { return {}; } })());
    const saveSettings = () => { try { localStorage.setItem(ME ? `${SETTINGS_KEY}:${ME.id}` : SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { } };
    let autoSyncInterval = null, lastAutoSync = null;
    const dash = { pair: "", from: "", to: "", scope: "actual" };
    let closings = [];

    // ==================== API ====================
    async function api(path, opts = {}) {
      const r = await fetch(path, { method: opts.method || "GET", headers: opts.body !== undefined ? { "Content-Type": "application/json" } : {}, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
      let d = {};
      try { d = await r.json(); } catch (e) { }
      if (r.status === 401 && d.auth === false) { location.href = "/login.html"; throw new Error(d.error); }
      if (!r.ok) { const e = new Error(d.error || `Error HTTP ${r.status}`); e.data = d; e.status = r.status; throw e; }
      return d;
    }
    const qs = o => { const p = new URLSearchParams(); Object.entries(o).forEach(([k, v]) => { if (v !== undefined && v !== null && v !== "") p.set(k, v); }); const s = p.toString(); return s ? "?" + s : ""; };

    // ==================== TOAST & LOG ====================
    function toast(m, t = "ok") { const el = $("toast"); el.className = `toast on ${t}`; el.innerHTML = `${ic(t === "ok" ? "ok" : "x", 14)} ${esc(m)}`; clearTimeout(window._tt); window._tt = setTimeout(() => el.classList.remove("on"), t === "ok" ? 3500 : 7000); }
    function log(m, t = "info") { logs.unshift({ time: new Date().toLocaleTimeString("es-PE", { timeZone: TZ }), m, t }); if (logs.length > 50) logs.length = 50; }

    // ==================== NAV ====================
    function nav() {
      const items = [
        { id: "dashboard", l: "Dashboard", i: "dash" },
        { id: "trades", l: "Operaciones", i: "chart" },
        { id: "closings", l: "Ciclos cerrados", i: "lock" },
        { id: "new", l: "Nueva Operación", i: "plus" },
        { id: "calculator", l: "Calculadora", i: "calc" },
        { id: "api", l: "APIs & Sync", i: "api" },
        { id: "issues", l: "Incidencias", i: "info" },
        { id: "settings", l: "Configuración", i: "gear" }
      ];
      const anyConn = Object.keys(connected).length > 0;
      $("nav").innerHTML = items.map(x =>
        `<div class="ni${page === x.id ? " on" : ""}" onclick="${x.id === "new" ? "openForm()" : `go('${x.id}')`}">${ic(x.i)} <span class="lbl">${x.l}</span>${x.id === "api" && anyConn ? '<span class="dot"></span>' : ""}${x.id === "issues" && issueCount ? `<span class="cnt">${issueCount}</span>` : ""}</div>`
      ).join("");
      const cn = APIS.filter(a => connected[a.id]);
      if (cn.length) { $("side-apis").style.display = "block"; $("side-api-list").innerHTML = cn.map(a => `<div class="api-name">${esc(a.name)}</div>`).join(""); } else $("side-apis").style.display = "none";
      const n = settings.name || "ArbiTrack";
      $("user-name").textContent = n; $("user-avatar").textContent = n.charAt(0).toUpperCase();
    }
    function go(p) { page = p; nav(); render(); }
    function render() {
      document.querySelectorAll(".pg").forEach(p => p.classList.remove("on"));
      const el = $("pg-" + page); if (el) el.classList.add("on");
      const fns = { dashboard: rDash, trades: rTrades, closings: rClosings, calculator: rCalc, api: rApi, issues: rIssues, settings: rSettings };
      Promise.resolve(fns[page] && fns[page]()).catch(e => toast(e.message, "err"));
    }
    async function loadTrades() {
      const d = await api("/api/v1/trades");
      trades = d.trades || [];
    }
    async function refreshIssueCount() {
      try { const d = await api("/api/v1/issues"); issueCount = d.issues.filter(i => i.severity !== "info").length; } catch (e) { }
      nav();
    }

    // ==================== DASHBOARD ====================
    function statCard(label, val, sub, color) {
      return `<div class="sc" style="background:linear-gradient(135deg,${color}08,rgba(15,19,32,0.9));border:1px solid ${color}20"><div class="gw" style="background:radial-gradient(circle,${color}10,transparent 70%)"></div><div class="slb">${label}</div><div class="sv">${val}</div>${sub ? `<div class="ss">${sub}</div>` : ""}</div>`;
    }
    const chartOpts = () => ({ responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#6b7488", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.03)" } }, y: { ticks: { color: "#6b7488", font: { size: 10 } }, grid: { color: "rgba(255,255,255,0.03)" } } } });

    async function rDash() {
      const period = { from: dash.from, to: dash.to, scope: dash.scope };
      const [s, rep] = await Promise.all([api("/api/v1/stats" + qs({ ...period, pair: dash.pair })), api("/api/v1/report" + qs(period)), loadClosings()]);
      const pairs = s.byPair || [];
      const p = pairs.find(x => x.pair === s.pair);
      if (!dash.pair && p) dash.pair = p.pair;
      const cn = APIS.filter(a => connected[a.id]);

      let h = "";
      if (cn.length) h += `<div class="conn-banner mb">${ic("ok", 14)} <span class="bg" style="background:rgba(38, 150, 132, 0.18);color:var(--green)">APIs:</span>${cn.map(a => `<span class="bg" style="background:rgba(152, 192, 239, 0.18);color:var(--blue);font-weight:700">${esc(a.name)}</span>`).join("")}${settings.autoSync ? `<span class="tag" style="background:rgba(152, 192, 239, 0.08);color:var(--blue);margin-left:auto">${ic("refresh", 12)} Auto-sync cada ${settings.autoSyncMinutes} min</span>` : ''}</div>`;

      h += `<div class="fxb mb2" style="flex-wrap:wrap;gap:10px"><h2 class="h1">Dashboard</h2><div class="fx" style="flex-wrap:wrap">
        ${closings.length ? `<select class="sel" style="width:auto" onchange="dash.scope=this.value;rDash()" title="Qué incluir"><option value="actual"${dash.scope === "actual" ? " selected" : ""}>Ciclo actual</option><option value="todo"${dash.scope === "todo" ? " selected" : ""}>Todo el historial</option></select>` : ""}
        <select class="sel" style="width:auto" onchange="dash.pair=this.value;rDash()" title="Mercado">${pairs.length ? pairs.map(x => `<option value="${esc(x.pair)}"${x.pair === s.pair ? " selected" : ""}>${esc(x.pair)}</option>`).join("") : "<option>Sin datos</option>"}</select>
        <input type="date" class="inp" style="width:auto" value="${dash.from}" onchange="dash.from=this.value;rDash()" title="Desde">
        <input type="date" class="inp" style="width:auto" value="${dash.to}" onchange="dash.to=this.value;rDash()" title="Hasta">
        ${[["7d", 7], ["30d", 30], ["Mes", "m"], ["Todo", 0]].map(([l, d]) => `<button class="btn btn-s" style="padding:6px 10px;font-size:11px" onclick="setDashRange('${d}')">${l}</button>`).join("")}
        <button class="btn btn-s" style="padding:6px 12px;font-size:11px" onclick="openCloseCycle()" title="Congelar lo hecho hasta ahora y empezar un ciclo nuevo">${ic("lock", 12)} Cerrar ciclo</button>
      </div></div>`;
      if (closings.length && dash.scope === "actual") h += `<div class="msg info">${ic("lock", 12)} Estás viendo el <b>ciclo actual</b>. Tienes ${closings.length} ciclo(s) cerrado(s) guardados en <a href="#" style="text-decoration:underline" onclick="event.preventDefault();go('closings')">Ciclos cerrados</a>.</div>`;

      if (s.issues && s.issues.error) h += `<div class="msg err">${ic("x", 12)} ${s.issues.error} operación(es) tienen errores y están excluidas de los cálculos. <a href="#" style="text-decoration:underline" onclick="event.preventDefault();go('issues')">Ver incidencias</a></div>`;
      if (s.excluded) h += `<div class="msg warn">${s.excluded} operación(es) no se contabilizan (pendientes, canceladas o con error). Solo cuentan las completadas.</div>`;
      if (pairs.length > 1) h += `<div class="msg info">Tienes ${pairs.length} mercados: ${pairs.map(x => esc(x.pair)).join(", ")}. Cada uno se calcula por separado; cambia de mercado en el selector.</div>`;

      if (!p) {
        h += `<div class="card empty">Aún no hay operaciones completadas${dash.from || dash.to ? " en este período" : ""}.<br><br><button class="btn btn-p" onclick="openImport()">${ic("up", 14)} Importar archivo</button> <button class="btn btn-s" onclick="openForm()">${ic("plus", 14)} Registrar operación</button></div>`;
        $("pg-dashboard").innerHTML = h;
        return;
      }
      const fi = p.fiat, cr = p.crypto;
      const avgB = Number(p.qtyBuy) > 0 ? Number(p.volBuy) / Number(p.qtyBuy) : 0;
      const avgS = Number(p.qtySell) > 0 ? Number(p.volSell) / Number(p.qtySell) : 0;
      const pairInfo = (rep.pairs || []).find(x => x.pair === p.pair) || {};
      const unrec = Number(pairInfo.unrecognizedProceeds || 0);

      h += `<div class="g3">${statCard("Ganancia Neta", fc(p.netProfit, fi), `${Number(p.roi) >= 0 ? "+" : ""}${nf(p.roi, 2, 3)}% sobre el costo · ${p.cycles} ciclo(s)`, "#269684")}${statCard("Operaciones", p.buys + p.sells, `${p.buys} compras · ${p.sells} ventas`, "#c7d3ea")}${statCard("Spread Prom.", avgB && avgS ? fp(avgS - avgB) : "—", `C: ${avgB ? fp(avgB) : "—"} · V: ${avgS ? fp(avgS) : "—"} (ponderados)`, "#e0b26a")}</div>`;
      h += `<div class="g3 mt">${statCard("Vol. Compra", fc(p.volBuy, fi), `${fq(p.qtyBuy)} ${esc(cr)} · ${p.buys} ops`, "#98c0ef")}${statCard("Vol. Venta", fc(p.volSell, fi), `${fq(p.qtySell)} ${esc(cr)} · ${p.sells} ops`, "#8b5cf6")}${statCard("Comisiones", fc(p.fees, fi), "cripto valorizada a costo + fiat", "#e46d4c")}</div>`;
      h += `<div class="g2 mt"><div class="card"><div class="h2">Ganancia Neta Acumulada</div><div style="height:190px"><canvas id="ch-cum"></canvas></div></div><div class="card"><div class="h2">Ganancia Neta Diaria</div><div style="height:190px"><canvas id="ch-day"></canvas></div></div></div>`;
      h += `<div class="g2 mt"><div class="card"><div class="h2">Volumen por Exchange (${esc(fi)})</div><div style="height:170px"><canvas id="ch-ex"></canvas></div></div><div class="card"><div class="h2">Resumen Detallado · ${esc(p.pair)}</div><div id="dash-sum"></div></div></div>`;
      $("pg-dashboard").innerHTML = h;

      $("dash-sum").innerHTML = [
        { l: "Ganancia Bruta", v: fc(p.grossProfit, fi), c: "#98c0ef" },
        { l: "(−) Comisiones", v: fc(p.fees, fi), c: "#e46d4c" },
        { l: "(−) Otros costos", v: fc(p.otherCosts, fi), c: "#e46d4c" },
        { l: "= Ganancia Neta", v: fc(p.netProfit, fi), c: "#269684" },
        { l: "Costo de lo vendido (FIFO)", v: fc(p.costOfSales, fi), c: "#8b5cf6" },
        { l: "Inventario al cierre", v: `${fq(p.inventoryQty)} ${esc(cr)} · ${fc(p.inventoryCost, fi)}`, c: "#e0b26a" },
        ...(unrec > 0 ? [{ l: "Ventas sin compra registrada (no cuentan)", v: fc(unrec, fi), c: "#e46d4c" }] : []),
        { l: "Margen neto", v: nf(p.roi, 2, 3) + "%", c: "#c7d3ea" },
      ].map(r => `<div class="fxb" style="padding:5px 10px;background:rgba(255,255,255,0.02);border-radius:7px;border-left:3px solid ${r.c};margin-bottom:6px"><span style="color:var(--muted);font-size:11px">${r.l}</span><span style="font-weight:700;color:${r.c};font-size:12px" class="mono">${r.v}</span></div>`).join("");

      // Resultado por día (hora de Lima): cierres de ciclo − otros costos
      const dm = {};
      (rep.cycles || []).filter(c => c.pair === p.pair).forEach(c => { const k = limaDay(c.closedAt); dm[k] = (dm[k] || 0) + Number(c.net) + (c.kind === "manual" ? Number(c.otherCosts || 0) : 0); });
      (rep.costs || []).filter(c => c.pair === p.pair).forEach(c => { const k = limaDay(c.dateUtc); dm[k] = (dm[k] || 0) - Number(c.value); });
      let cum = 0;
      const dd = Object.keys(dm).sort().map(k => { cum += dm[k]; return { d: k.slice(5), p: dm[k], c: cum }; });
      const ex = (rep.byExchange || []).filter(e => e.pair === p.pair).map(e => [e.exchange, Number(e.buyFiat) + Number(e.sellFiat)]);

      setTimeout(() => {
        if (!window.Chart) return;
        ["cum", "day", "ex"].forEach(k => charts[k] && charts[k].destroy());
        charts.cum = new Chart($("ch-cum"), { type: "line", data: { labels: dd.map(d => d.d), datasets: [{ data: dd.map(d => d.c), borderColor: "#98c0ef", backgroundColor: "rgba(152, 192, 239, 0.08)", fill: true, tension: 0.3, pointRadius: 3 }] }, options: chartOpts() });
        charts.day = new Chart($("ch-day"), { type: "bar", data: { labels: dd.map(d => d.d), datasets: [{ data: dd.map(d => d.p), backgroundColor: dd.map(d => d.p >= 0 ? "#3daa94" : "#e46d4c"), borderRadius: 4 }] }, options: chartOpts() });
        charts.ex = new Chart($("ch-ex"), { type: "doughnut", data: { labels: ex.map(e => e[0]), datasets: [{ data: ex.map(e => e[1]), backgroundColor: CC.slice(0, ex.length), borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "right", labels: { color: "#9da7ba", font: { size: 11 }, padding: 12 } } } } });
      }, 30);
    }
    function setDashRange(d) {
      if (d === "0") { dash.from = ""; dash.to = ""; }
      else if (d === "m") { const t = limaDay(); dash.from = t.slice(0, 8) + "01"; dash.to = t; }
      else { dash.from = daysAgo(Number(d) - 1); dash.to = limaDay(); }
      rDash();
    }

    // ==================== OPERACIONES ====================
    async function rTrades() {
      let h = `<div class="fxb mb"><div><h2 class="h1">Operaciones</h2><p style="color:var(--dim);margin-top:4px" id="t-cnt"></p></div><div class="fx"><button class="btn btn-s" onclick="openImport()">${ic("up", 14)} Importar</button><button class="btn btn-s" onclick="openExport()">${ic("dl", 14)} Exportar</button><button class="btn btn-p" onclick="openForm()">${ic("plus", 14)} Nueva</button></div></div>`;
      h += `<div class="card mb fxw" id="t-flt"></div>`;
      h += `<div class="card" style="padding:0;overflow:auto"><table><thead id="t-th"></thead><tbody id="t-tb"></tbody></table></div>`;
      $("pg-trades").innerHTML = h;
      await loadTrades();
      const uniq = k => [...new Set(trades.map(t => t[k]).filter(Boolean))].sort();
      $("t-flt").innerHTML = `<div style="position:relative;flex:1 1 160px"><svg width="14" height="14" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim)"><use href="#i-search"/></svg><input class="inp" style="padding-left:32px" placeholder="Buscar orden, contraparte, notas…" id="tf-q" oninput="fTrades()"></div>
        <select class="sel" style="flex:0 0 110px" id="tf-t" onchange="fTrades()"><option value="">Tipo</option><option value="compra">Compra</option><option value="venta">Venta</option></select>
        <select class="sel" style="flex:0 0 120px" id="tf-s" onchange="fTrades()"><option value="">Estado</option>${Object.entries(ST).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join("")}</select>
        <select class="sel" style="flex:0 0 110px" id="tf-e" onchange="fTrades()"><option value="">Exchange</option>${uniq("exchange").map(x => `<option>${esc(x)}</option>`).join("")}</select>
        <select class="sel" style="flex:0 0 110px" id="tf-p" onchange="fTrades()"><option value="">Par</option>${uniq("pair").map(x => `<option>${esc(x)}</option>`).join("")}</select>
        <select class="sel" style="flex:0 0 100px" id="tf-src" onchange="fTrades()"><option value="">Fuente</option><option value="manual">Manual</option><option value="api">API</option><option value="csv">Archivo</option></select>`;
      fTrades();
    }
    function fTrades() {
      const q = ($("tf-q")?.value || "").toLowerCase(), ft = $("tf-t")?.value, fs = $("tf-s")?.value, fe = $("tf-e")?.value, fpair = $("tf-p")?.value, fsc = $("tf-src")?.value;
      let r = trades;
      if (q) r = r.filter(t => [t.counterparty, t.notes, t.exchange, t.payMethod, t.orderId].some(x => String(x || "").toLowerCase().includes(q)));
      if (ft) r = r.filter(t => t.type === ft);
      if (fs) r = r.filter(t => t.status === fs);
      if (fe) r = r.filter(t => t.exchange === fe);
      if (fpair) r = r.filter(t => t.pair === fpair);
      if (fsc) r = r.filter(t => t.source === fsc);
      const shown = r.slice(0, 500);
      $("t-cnt").textContent = `${r.length} de ${trades.length}${r.length > shown.length ? ` · mostrando las ${shown.length} más recientes` : ""}`;
      $("t-th").innerHTML = `<tr><th>Fecha</th><th>Tipo</th><th>N° Orden</th><th>Exch</th><th>Par</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Total</th><th class="num">Fee</th><th>Método</th><th>Contrap.</th><th>Estado</th><th title="¿Entra en los cálculos?">Cuenta</th><th>Src</th><th></th></tr>`;
      $("t-tb").innerHTML = shown.length ? shown.map(t => {
        const st = ST[t.status] || [t.status, "#9da7ba"];
        const errs = (t.issues || []).filter(i => i.severity === "error").length;
        const src = SRC[t.source] || SRC.manual;
        return `<tr>
          <td style="font-size:12px;color:var(--muted);white-space:nowrap">${t.closingId ? `<span class="lock-tag" title="En un ciclo cerrado: no se puede editar">${ic("lock", 11)}</span> ` : ""}${fd(t.dateUtc)}</td>
          <td><span class="bg" style="background:${t.type === "compra" ? "rgba(152, 192, 239, 0.18);color:var(--blue)" : "rgba(38, 150, 132, 0.18);color:var(--green)"}">${t.type === "compra" ? "⬇ compra" : "⬆ venta"}</span></td>
          <td class="mono" style="font-size:11px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.orderId)}">${esc(t.orderId || "—")}</td>
          <td style="font-weight:600">${esc(t.exchange)}</td>
          <td style="color:var(--head);font-weight:500">${esc(t.pair)}</td>
          <td class="num" style="font-weight:600">${fq(t.exact?.amount ?? t.amount)}</td>
          <td class="num">${fp(t.exact?.price ?? t.price)}</td>
          <td class="num" style="font-weight:700;color:${t.type === "compra" ? "var(--blue)" : "var(--green)"}">${fc(t.exact?.total ?? t.total, t.fiat)}</td>
          <td class="num" style="color:${Number(t.fee) > 0 ? "var(--red)" : "#6b7488"};font-size:11px">${Number(t.fee) > 0 ? `${fq(t.exact?.fee ?? t.fee)} ${esc(t.feeAsset)}` : "—"}</td>
          <td><span class="tag">${esc(t.payMethod || "—")}</span></td>
          <td style="font-size:12px;color:var(--muted)">${esc(t.counterparty || "—")}</td>
          <td><span class="bg" style="background:${st[1]}20;color:${st[1]}">${st[0]}</span></td>
          <td>${t.countable ? `<span style="color:var(--green)" title="Se contabiliza">${ic("ok", 14)}</span>` : `<span style="color:${errs ? "var(--red)" : "var(--dim)"};cursor:help" title="${esc(t.excludedReason || "")}">${errs ? "⚠" : "—"}</span>`}</td>
          <td><span class="bg" style="background:${src[1]};font-size:10px">${src[0]}</span></td>
          <td><div class="fx" style="justify-content:flex-end;gap:2px"><button class="btn-g" title="Detalle y trazabilidad" onclick="openTrace('${esc(t.id)}')">${ic("info", 14)}</button>${t.closingId
            ? `<span class="lock-tag" title="Pertenece a un ciclo cerrado. Reábrelo para editarla.">${ic("lock", 14)}</span>`
            : `<button class="btn-g" title="Editar" onclick="openForm('${esc(t.id)}')">${ic("edit", 14)}</button><button class="btn-g" title="Eliminar" style="color:var(--red)" onclick="delTrade('${esc(t.id)}')">${ic("trash", 14)}</button>`}</div></td>
        </tr>`;
      }).join("") : `<tr><td colspan="15" class="empty">Sin resultados</td></tr>`;
    }

    async function delTrade(id) {
      const t = trades.find(x => x.id === id);
      if (!confirm(`¿Eliminar la operación ${t?.orderId || ""}?\n\nNo se volverá a importar en futuras sincronizaciones. Puedes restaurarla desde Configuración.`)) return;
      try { await api("/api/v1/trades/" + encodeURIComponent(id), { method: "DELETE" }); toast("Operación eliminada"); await loadTrades(); fTrades(); refreshIssueCount(); }
      catch (e) { toast(e.message, "err"); }
    }

    async function openTrace(id) {
      try {
        const d = await api(`/api/v1/trades/${encodeURIComponent(id)}/trace`);
        const t = d.trade;
        $("ml").className = "ml wide";
        $("ml").innerHTML = `<div class="fxb" style="margin-bottom:14px"><h3 style="font-size:17px;font-weight:700">${ic("info", 16)} Detalle de la operación</h3><button class="btn-g" onclick="closeForm()">${ic("x", 16)}</button></div>
          <div class="g2">
            <div class="card"><div class="kv">
              <div>N° de orden</div><div class="mono">${esc(t.orderId || "(sin ID)")}</div>
              <div>Fecha (Lima)</div><div>${fd(t.dateUtc)}</div>
              <div>Exchange · Par</div><div>${esc(t.exchange)} · ${esc(t.pair)}</div>
              <div>Tipo</div><div>${t.side === "buy" ? "Compra" : "Venta"}</div>
              <div>Cantidad</div><div class="mono">${fq(t.amount)} ${esc(t.crypto)}</div>
              <div>Precio</div><div class="mono">${fp(t.price)}</div>
              <div>Total</div><div class="mono">${fc(t.total, t.fiat)}</div>
              <div>Comisión</div><div class="mono">${Number(t.fee) ? `${fq(t.fee)} ${esc(t.feeAsset)}` : "—"}</div>
              <div>Estado</div><div>${(ST[t.status] || [t.status])[0]}${t.statusRaw ? ` <span style="color:var(--dim)">(${esc(t.statusRaw)})</span>` : ""}</div>
              <div>¿Se contabiliza?</div><div style="color:${d.countable ? "var(--green)" : "var(--yellow)"}">${d.countable ? "Sí" : "No — " + esc(d.excludedReason)}</div>
              <div>Fuente</div><div>${esc((SRC[t.source] || [t.source])[0])}${t.sourceRef?.file ? ` · ${esc(t.sourceRef.file)} fila ${esc(t.sourceRef.row)}` : ""}</div>
            </div></div>
            <div class="card">
              <div class="h2">Incidencias</div>
              ${d.issues.length ? d.issues.map(i => `<div class="msg ${i.severity === "error" ? "err" : i.severity === "warning" ? "warn" : "info"}">${esc(i.message)}</div>`).join("") : `<div style="color:var(--dim)">Sin incidencias.</div>`}
              ${d.cycles.length ? `<div class="h2 mt">Ciclos donde participa</div>${d.cycles.map(c => `<div class="fxb" style="padding:5px 10px;background:rgba(255,255,255,0.02);border-radius:7px;margin-bottom:5px"><span class="mono" style="font-size:11px;color:var(--muted)">${esc(c.id)}</span><span class="mono" style="color:${Number(c.net) >= 0 ? "var(--green)" : "var(--red)"};font-weight:700">${fc(c.net, t.fiat)}</span></div>`).join("")}` : ""}
            </div>
          </div>
          ${d.allocations.length ? `<div class="card mt"><div class="h2">Trazabilidad FIFO</div><div class="scroll-y"><table><thead><tr><th>Ciclo</th><th>Compra</th><th>Venta</th><th class="num">Cantidad</th><th class="num">Precio compra</th><th class="num">Costo</th></tr></thead><tbody>${d.allocations.map(a => `<tr><td class="mono" style="font-size:11px">${esc(a.cycleId)}</td><td class="mono" style="font-size:11px">${esc(a.buyId)}</td><td class="mono" style="font-size:11px">${esc(a.sellId)}</td><td class="num">${fq(a.qty)}</td><td class="num">${fp(a.buyPrice)}</td><td class="num">${fc(a.cost, t.fiat)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
          ${t.history.length ? `<div class="card mt"><div class="h2">Historial de cambios</div>${t.history.map(x => `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">${fd(x.at)} · ${esc(x.by)}: ${x.changes.map(c => `${esc(c.field)} ${esc(c.from)} → ${esc(c.to)}`).join(", ")}</div>`).join("")}</div>` : ""}
          <details class="mt"><summary style="cursor:pointer;color:var(--dim);font-size:12px">Dato original recibido del exchange</summary><pre style="white-space:pre-wrap;font-size:11px;color:var(--muted);margin-top:8px">${esc(JSON.stringify(t.raw, null, 2))}</pre></details>`;
        $("ov").classList.add("open");
      } catch (e) { toast(e.message, "err"); }
    }

    // ==================== EXPORTAR ====================
    // ==================== CICLOS CERRADOS ====================
    async function loadClosings() { try { closings = (await api("/api/v1/closings")).closings || []; } catch (e) { closings = []; } }
    async function rClosings() {
      await loadClosings();
      let h = `<div class="fxb mb2" style="flex-wrap:wrap;gap:10px"><div><h2 class="h1">Ciclos cerrados</h2><p style="color:var(--dim);margin-top:6px;font-size:13px;max-width:620px">Un ciclo cerrado queda congelado: sus operaciones no se pueden editar y su resultado no cambia. Lo que registres después va al ciclo actual.</p></div><button class="btn btn-p" onclick="openCloseCycle()">${ic("lock", 14)} Cerrar ciclo</button></div>`;
      if (!closings.length) h += `<div class="card empty">Aún no has cerrado ningún ciclo.<br><br>Cuando termines una ronda de arbitraje, ciérrala aquí. Queda guardada con su resultado y sus reportes, y el ciclo actual empieza limpio.</div>`;
      else h += closings.map(closingCard).join("");
      $("pg-closings").innerHTML = h;
    }
    function closingCard(k) {
      const s = k.summary, [cr, fi] = k.pair.split("/"), net = Number(s.net);
      const line = (l, v, c) => `<div class="kline"><span>${l}</span><b${c ? ` style="color:${c}"` : ""}>${v}</b></div>`;
      const inv = Number(k.carriedQty) > 0
        ? `${fq(k.carriedQty)} ${esc(cr)} · ${fc(s.closingInventory.cost, fi)}`
        : (Number(s.closingInventory.qty) > 0 ? `${fq(s.closingInventory.qty)} ${esc(cr)} (se quedó en este ciclo)` : "Ninguno");
      return `<div class="card mb">
        <div class="fxb" style="flex-wrap:wrap;gap:12px;margin-bottom:14px">
          <div><div class="h2" style="margin:0">${ic("lock", 14)} ${esc(k.name)}</div>
            <div style="color:var(--dim);font-size:12px;margin-top:6px">${esc(k.pair)} · ${k.firstUtc ? fd(k.firstUtc) : "—"} → ${fd(k.cutoffUtc)} · ${k.tradeCount} operaciones${k.costCount ? ` · ${k.costCount} costos` : ""}</div></div>

    function handleImportFile(input) { if (input.files && input.files.length) importFiles([...input.files]); input.value = ""; }
    async function readFile(f) {
      const buf = new Uint8Array(await f.arrayBuffer());
      // .xlsx (zip) y .xls de Excel 97-2003 (archivo OLE) viajan en binario
      const zip = buf[0] === 0x50 && buf[1] === 0x4b, ole = buf[0] === 0xd0 && buf[1] === 0xcf && buf[2] === 0x11 && buf[3] === 0xe0;
      if (/\.xlsx$/i.test(f.name) || zip || ole) {
        let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
        return { contentBase64: btoa(bin) };
      }
      try { return { content: new TextDecoder("utf-8", { fatal: true }).decode(buf) }; }   // UTF-8 válido
      catch (e) { return { content: new TextDecoder("windows-1252").decode(buf) }; }       // CSV de Excel en español
    }

        if (!res.ok && !r.status) throw new Error(r.error || `Error HTTP ${res.status}`);

        : `<span class="bg" style="background:rgba(224, 178, 106, 0.15);color:var(--yellow)">Vista previa</span>`;

      if (r.committed) {

    function cCalc() {
      const bp = parseFloat($("c-bp").value) || 0, sp = parseFloat($("c-sp").value) || 0, am = parseFloat($("c-am").value) || 0, tf = parseFloat($("c-tf").value) || 0;

        { l: `Recibes al vender (−${nf(sc * 100)}%)`, v: nf(tS), c: "#269684" },
        { l: "Bruto", v: nf(gr), c: "#8b5cf6" },
        { l: "Comisión compra", v: nf(am * bc * bp), c: "#e46d4c" },
        { l: "Comisión venta", v: nf(am * sc * sp), c: "#e46d4c" },
        { l: "Costo transferencia", v: nf(tf), c: "#e46d4c" },
        { l: "Precio de venta de equilibrio", v: be ? fp(be) : "—", c: "#c7d3ea" },
      ].map(r => `<div class="fxb" style="padding:4px 10px;background:rgba(0,0,0,0.2);border-radius:6px;margin-bottom:4px"><span style="color:var(--muted);font-size:11px">${r.l}</span><span class="mono" style="font-weight:700;color:${r.c};font-size:12px">${r.v}</span></div>`).join("")}</div>`;
      $("c-sc2").innerHTML = `<div class="h2">Escenarios por Volumen</div><div class="g6">${[100, 500, 1000, 2000, 5000, 10000].map(a => { const n = sim(a).ne; return `<div style="background:rgba(255,255,255,0.02);border-radius:10px;padding:12px;text-align:center;border:1px solid ${n >= 0 ? "rgba(38, 150, 132, 0.15)" : "rgba(228, 109, 76, 0.15)"}"><div style="font-size:11px;color:var(--dim)">${a.toLocaleString("es-PE")} USDT</div><div class="mono" style="font-size:15px;font-weight:800;color:${n >= 0 ? "var(--green)" : "var(--red)"}">${n >= 0 ? "+" : ""}${nf(n)}</div></div>`; }).join("")}</div>`;
    }

          <div class="fxb" style="margin-bottom:10px">

      if (logs.length) h += `<div class="card"><div class="fxb" style="margin-bottom:10px"><div class="h2" style="margin-bottom:0">Actividad</div><button class="btn btn-g" style="font-size:11px" onclick="logs=[];rApi()">Limpiar</button></div><div style="max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:3px">${logs.map(l => `<div class="fx" style="padding:5px 10px;background:rgba(255,255,255,0.02);border-radius:5px;border-left:3px solid ${l.t === "err" ? "var(--red)" : l.t === "ok" ? "var(--green)" : "#6b7488"};font-size:12px;color:var(--muted)"><span class="mono" style="font-size:10px;color:#6b7488;flex-shrink:0">${l.time}</span>${esc(l.m)}</div>`).join("")}</div></div>`;

    async function connEx(id) {
      const a = APIS.find(x => x.id === id);
      const k = $("ak-" + id).value.trim(), s = $("as-" + id).value.trim(), p = a.passphrase ? $("ap-" + id).value.trim() : undefined;
      if (!k || !s || (a.passphrase && !p)) { $("am-" + id).innerHTML = `<span style="color:var(--red)">Completa ${a.passphrase ? "API Key, Secret y Passphrase" : "API Key y Secret"}</span>`; return; }
      try {
        await api("/api/v1/exchange/connect", { method: "POST", body: { exchange: a.name, apiKey: k, apiSecret: s, passphrase: p } });
        log(`${a.name}: conectado`, "ok"); toast(`${a.name} conectado`);
        await loadConnected(); startAutoSync(); rApi();
      } catch (e) { $("am-" + id).innerHTML = `<span style="color:var(--red)">${esc(e.message)}</span>`; }
    }
    async function discEx(id) {
      const a = APIS.find(x => x.id === id);
      if (!confirm(`¿Desconectar ${a.name}? Se borran sus credenciales (tus operaciones se conservan).`)) return;
      try { await api("/api/v1/exchange/" + id, { method: "DELETE" }); log(`${a.name}: desconectado`, "err"); toast(`${a.name} desconectado`); await loadConnected(); startAutoSync(); rApi(); }
      catch (e) { toast(e.message, "err"); }
    }
    async function syncEx(id, from, to, silent) {
      const a = APIS.find(x => x.id === id);
      from = from || $("sf-" + id)?.value; to = to || $("st-" + id)?.value;
      if (from && to && from > to) { toast("La fecha 'Desde' es posterior a 'Hasta'", "err"); return; }
      const el = $("sm-" + id), btn = $("sb-" + id);
      if (!silent && el) el.innerHTML = `<span style="color:var(--yellow)">${ic("refresh", 12)} Sincronizando ${esc(a.name)} (${from} → ${to})… puede tardar</span>`;
      if (btn) btn.disabled = true;
      try {
        const r = await api("/api/v1/sync/" + id, { method: "POST", body: { startDate: from, endDate: to } });
        const sc = (r.statusChanges || []).length;
        const msg = `${r.totalFound} encontradas · ${r.newImported} nuevas · ${r.updated} actualizadas${sc ? ` (${sc} cambios de estado)` : ""} · ${r.unchanged} sin cambios`;
        log(`${a.name}: ${msg}`, "ok");
        if (el) el.innerHTML = `<span style="color:var(--green)">${ic("ok", 12)} ${msg}</span>`;
        if (!silent || r.newImported || r.updated) toast(`${a.name}: ${r.newImported} nuevas, ${r.updated} actualizadas`);
        if (r.newImported || r.updated) { await loadTrades(); refreshIssueCount(); if (page === "dashboard") rDash(); else if (page === "trades") fTrades(); }
      } catch (e) {
        log(`${a.name}: ${e.message}`, "err");
        if (el) el.innerHTML = `<span style="color:var(--red)">${ic("x", 12)} ${esc(e.message)}</span>${e.data?.problems?.length ? `<div style="font-size:11px;color:var(--dim);margin-top:4px">${e.data.problems.slice(0, 5).map(esc).join("<br>")}</div>` : ""}`;
        if (!silent) toast(`${a.name}: error al sincronizar`, "err");
      } finally { if (btn) btn.disabled = false; }
    }
    function toggleAutoSync() { settings.autoSync = !settings.autoSync; saveSettings(); startAutoSync(); log(`Auto-sync ${settings.autoSync ? "activado" : "desactivado"}`, "ok"); rApi(); }
    function startAutoSync() {
      if (autoSyncInterval) clearInterval(autoSyncInterval);
      autoSyncInterval = null;
      if (!settings.autoSync || !APIS.some(a => a.mode === "api" && connected[a.id])) return;
      autoSyncInterval = setInterval(() => autoSyncNow(false), settings.autoSyncMinutes * 60000);
    }
    async function autoSyncNow(manual) {
      for (const a of APIS.filter(x => x.mode === "api" && connected[x.id])) await syncEx(a.id, daysAgo(2), limaDay(), !manual);
      lastAutoSync = new Date();
    }

    // ==================== INCIDENCIAS ====================

      const count = s => list.filter(i => i.severity === s).length;

      if (!sev) h += `<div class="g3 mb">${statCard("Errores", count("error"), "operaciones excluidas de los cálculos", "#e46d4c")}${statCard("Advertencias", count("warning"), "revisar, pero se contabilizan", "#e0b26a")}${statCard("Información", count("info"), "datos derivados, inventario abierto…", "#98c0ef")}</div>`;
      h += `<div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Severidad</th><th>Fecha</th><th>Par</th><th>Exchange</th><th>N° Orden</th><th>Detalle</th><th></th></tr></thead><tbody>${list.length ? list.slice(0, 1000).map(i => `<tr><td><span class="bg" style="background:${SEV[i.severity][1]}20;color:${SEV[i.severity][1]}">${SEV[i.severity][0]}</span></td><td style="font-size:12px;color:var(--muted);white-space:nowrap">${i.dateUtc ? fd(i.dateUtc) : "—"}</td><td style="color:var(--yellow)">${esc(i.pair || "")}</td><td>${esc(i.exchange || "")}</td><td class="mono" style="font-size:11px">${esc(i.orderId || "")}</td><td style="font-size:12px">${esc(i.message)}</td><td>${i.tradeId ? `<button class="btn-g" title="Ver operación" onclick="openTraceById('${esc(i.tradeId)}')">${ic("info", 14)}</button>` : ""}</td></tr>`).join("") : `<tr><td colspan="7" class="empty">Sin incidencias 🎉</td></tr>`}</tbody></table></div>`;
      $("pg-issues").innerHTML = h;
    }
    async function openTraceById(id) { if (!trades.find(t => t.id === id)) await loadTrades(); openTrace(id); }

        <div class="card mb"><div class="h2">Perfil y valores por defecto</div>
          <div class="g4" style="gap:12px">
            <div><div class="lb">Tu nombre (aparece en el Excel)</div><input class="inp" id="s-name" value="${esc(settings.name)}" placeholder="Nombre o razón social"></div>
            <div><div class="lb">Exchange</div><select class="sel" id="s-ex">${opts(EX, settings.exchange)}</select></div>
            <div><div class="lb">Crypto</div><select class="sel" id="s-cr">${opts(CR, settings.crypto)}</select></div>
            <div><div class="lb">Fiat</div><select class="sel" id="s-fi">${opts(FI, settings.fiat)}</select></div>

          <p style="font-size:12px;color:var(--muted);margin-bottom:10px">«Deshacer» elimina las operaciones que llegaron <b>solo</b> en ese lote (quedan en el historial y se pueden restaurar).</p>
          <div class="scroll-y"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Origen</th><th class="num">Nuevas</th><th class="num">Actualizadas</th><th class="num">Rechazadas</th><th></th></tr></thead><tbody>${batches.length ? batches.slice(0, 200).map(b => `<tr><td style="font-size:12px;white-space:nowrap">${fd(b.at)}</td><td>${KIND[b.kind] || esc(b.kind)}</td><td>${esc(b.file || b.exchange || "")}</td><td class="num">${b.inserted ?? 0}</td><td class="num">${b.updated ?? 0}</td><td class="num">${b.rejected ?? b.quarantined ?? 0}</td><td>${b.undoneAt ? `<span class="tag">deshecho</span>` : b.kind !== "migration" ? `<button class="btn btn-d" style="padding:4px 10px;font-size:11px" onclick="undoBatch('${esc(b.id)}')">Deshacer</button>` : ""}</td></tr>`).join("") : `<tr><td colspan="7" class="empty">Aún no hay importaciones.</td></tr>`}</tbody></table></div>

          <div class="scroll-y"><table><tbody>${deleted.length ? deleted.map(t => `<tr><td style="font-size:12px;white-space:nowrap">${fd(t.dateUtc)}</td><td>${esc(t.exchange)}</td><td class="mono" style="font-size:11px">${esc(t.orderId || "—")}</td><td>${t.type}</td><td class="num">${fc(t.exact?.total ?? t.total, t.fiat)}</td><td><button class="btn btn-ok" style="padding:4px 10px;font-size:11px" onclick="restoreTrade('${esc(t.id)}')">Restaurar</button></td></tr>`).join("") : `<tr><td class="empty">No hay operaciones eliminadas.</td></tr>`}</tbody></table></div>

      if (ME) api("/api/v1/auth/me", { method: "PUT", body: { name: settings.name } }).catch(e => toast(e.message, "err"));
    }
    async function logout() {
      try { await api("/api/v1/auth/logout", { method: "POST" }); } catch (e) { }
      location.href = "/login.html";
    }
    async function changePassword() {
      try {
        await api("/api/v1/auth/password/change", { method: "POST", body: { currentPassword: $("s-pw0").value, newPassword: $("s-pw1").value } });
        $("s-pw0").value = $("s-pw1").value = ""; toast("Contraseña actualizada. Se cerraron tus otras sesiones.");

    async function deleteAccount() {

    async function undoBatch(id) {
      if (!confirm("¿Deshacer este lote?")) return;

      catch (e) { toast(e.message, "err"); }
    }
    async function restoreTrade(id) {
      try { await api(`/api/v1/trades/${encodeURIComponent(id)}/restore`, { method: "POST" }); toast("Operación restaurada"); await loadTrades(); refreshIssueCount(); rSettings(); }
      catch (e) { toast(e.message, "err"); }

    function qTot() { const t = $("q-tot"); const a = parseFloat($("q-amt").value), p = parseFloat($("q-pr").value); if (t.dataset.manual !== "1" && a > 0 && p > 0) t.value = String(Math.round(a * p * 100) / 100); }

    async function qSave() {
      const a = parseFloat($("q-amt").value) || 0, p = parseFloat($("q-pr").value) || 0, pct = parseFloat($("q-fee").value) || 0;
      if (!(a > 0) || !(p > 0)) { $("q-err").innerHTML = `<div class="msg err mt">Ingresa cantidad y precio</div>`; return; }
      $("q-save").disabled = true;
      try {
        await api("/api/v1/trades", { method: "POST", body: { type: qType, date: limaInput(), exchange: $("q-ex").value, crypto: $("q-cr").value, fiat: $("q-fi").value, amount: String(a), price: String(p), total: $("q-tot").value || undefined, fee: pct > 0 ? String(a * pct / 100) : "0", feeType: "crypto", payMethod: $("q-pm").value, counterparty: $("q-cp").value.trim(), status: "completado", notes: "Registro rápido" } });
        toggleQuick(); toast(`${qType === "compra" ? "Compra" : "Venta"} registrada ⚡`);
        await loadTrades(); refreshIssueCount(); render();
      } catch (e) { $("q-err").innerHTML = `<div class="msg err mt">${esc(e.message)}</div>`; $("q-save").disabled = false; }
    }

    // ==================== INIT ====================
    async function init() {
      nav();
      try {
        const h = await api("/health");
        const me = await api("/api/v1/auth/me");
        ME = me.user;
        if (ME) {
          // Preferencias guardadas en este navegador, separadas por cuenta.
          try { Object.assign(settings, JSON.parse(localStorage.getItem(`${SETTINGS_KEY}:${ME.id}`)) || {}); } catch (e) { }
          if (!settings.name && ME.name) settings.name = ME.name;
        }
        $("backend-status").textContent = ME ? ME.email : `Backend v${h.version} · ${h.trades} ops`;
      } catch (e) {
        if (e.status === 401) return;
        $("backend-status").textContent = "Sin conexión al backend";
        $("pg-dashboard").innerHTML = `<div class="card empty"><div class="msg err">No se pudo conectar con el servidor. Recarga la página en unos segundos.</div></div>`;
        return;
      }
      await Promise.all([loadTrades().catch(e => toast(e.message, "err")), loadConnected(), loadClosings()]);
      nav(); render(); refreshIssueCount();
      startAutoSync();
      if (!window.Chart) log("No se cargó Chart.js (sin internet): los gráficos no se mostrarán.", "err");
    }
    init();
  </script>
</body>

</html>
